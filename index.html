<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Expert Foguete — Nicho, Avatar e Método</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=Inter:wght@300;400;500&display=swap');

  :root {
    --bg: #0d0010;
    --surface: #160018;
    --card: #1e0026;
    --border: #3a1045;
    --accent: #c026d3;
    --accent2: #f472b6;
    --accent3: #e879f9;
    --text: #fdf4ff;
    --muted: #a855b5;
    --radius: 16px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg); color: var(--text);
    font-family: 'Inter', sans-serif; min-height: 100vh; overflow-x: hidden;
  }
  .bg-glow {
    position: fixed; top: 0; left: 0; right: 0; bottom: 0;
    pointer-events: none; z-index: 0;
    background: radial-gradient(ellipse 60% 40% at 20% 10%, rgba(192,38,211,0.15) 0%, transparent 70%),
                radial-gradient(ellipse 40% 30% at 80% 80%, rgba(244,114,182,0.10) 0%, transparent 70%);
  }
  .app {
    position: relative; z-index: 1;
    max-width: 780px; margin: 0 auto; padding: 32px 20px 80px;
  }
  .header { text-align: center; margin-bottom: 40px; }
  .badge {
    display: inline-flex; align-items: center; gap: 6px;
    background: rgba(192,38,211,0.15); border: 1px solid rgba(192,38,211,0.35);
    color: #e879f9; padding: 6px 16px; border-radius: 100px;
    font-size: 11px; font-weight: 600; letter-spacing: 0.08em;
    text-transform: uppercase; margin-bottom: 16px;
  }
  h1 {
    font-family: 'Syne', sans-serif;
    font-size: clamp(28px, 5vw, 44px); font-weight: 800; line-height: 1.1;
    background: linear-gradient(135deg, #ffffff 0%, #e879f9 50%, #f472b6 100%);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent; margin-bottom: 12px;
  }
  .subtitle { color: var(--muted); font-size: 15px; line-height: 1.6; }
  .stepper {
    display: flex; align-items: center;
    margin-bottom: 36px; background: var(--surface);
    border: 1px solid var(--border); border-radius: var(--radius); padding: 16px 20px;
  }
  .step {
    display: flex; flex-direction: column; align-items: center; gap: 4px;
    flex: 1; cursor: pointer; transition: all 0.2s;
  }
  .step-circle {
    width: 36px; height: 36px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 13px; font-weight: 700; transition: all 0.3s;
    border: 2px solid var(--border); background: var(--card); color: var(--muted);
  }
  .step.active .step-circle { border-color: var(--accent); background: rgba(192,38,211,0.2); color: #e879f9; }
  .step.done .step-circle { border-color: var(--accent2); background: rgba(244,114,182,0.15); color: var(--accent2); }
  .step-label { font-size: 10px; font-weight: 600; color: var(--muted); letter-spacing: 0.04em; text-align: center; }
  .step.active .step-label { color: #e879f9; }
  .step.done .step-label { color: var(--accent2); }
  .step-connector { height: 2px; flex: 1; background: var(--border); border-radius: 2px; transition: background 0.3s; }
  .step-connector.done { background: var(--accent2); }
  .phase-card {
    background: var(--card); border: 1px solid var(--border);
    border-radius: var(--radius); padding: 28px; animation: fadeUp 0.4s ease;
  }
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(16px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .phase-header {
    display: flex; align-items: center; gap: 14px;
    margin-bottom: 24px; padding-bottom: 20px; border-bottom: 1px solid var(--border);
  }
  .phase-icon {
    width: 48px; height: 48px; border-radius: 12px;
    display: flex; align-items: center; justify-content: center; font-size: 22px; flex-shrink: 0;
  }
  .phase-icon.p1 { background: rgba(192,38,211,0.15); }
  .phase-icon.p2 { background: rgba(244,114,182,0.15); }
  .phase-icon.p3 { background: rgba(232,121,249,0.12); }
  .phase-title { font-family: 'Syne', sans-serif; font-size: 20px; font-weight: 700; }
  .phase-desc { font-size: 13px; color: var(--muted); margin-top: 3px; }
  .question-block { margin-bottom: 22px; }
  .question-label {
    font-size: 13px; font-weight: 600; color: var(--text);
    margin-bottom: 8px; display: flex; align-items: flex-start; gap: 8px;
  }
  .q-num {
    background: rgba(192,38,211,0.25); color: #e879f9;
    font-size: 10px; font-weight: 700; border-radius: 6px;
    padding: 2px 6px; flex-shrink: 0; margin-top: 2px;
  }
  textarea {
    width: 100%; background: var(--surface); border: 1px solid var(--border);
    border-radius: 10px; color: var(--text); font-family: 'Inter', sans-serif;
    font-size: 14px; padding: 12px 14px; resize: vertical; transition: border-color 0.2s;
    outline: none; min-height: 80px;
  }
  textarea:focus { border-color: var(--accent); }
  textarea.short { min-height: 48px; resize: none; }
  .hint { font-size: 11px; color: var(--muted); margin-top: 5px; font-style: italic; }
  .client-tabs { display: flex; gap: 8px; margin-bottom: 20px; }
  .tab-btn {
    flex: 1; padding: 10px; border-radius: 10px;
    border: 1px solid var(--border); background: var(--surface);
    color: var(--muted); font-size: 12px; font-weight: 600; cursor: pointer; transition: all 0.2s;
  }
  .tab-btn.active { border-color: var(--accent2); background: rgba(244,114,182,0.1); color: var(--accent2); }
  .tab-btn.filled { border-color: var(--accent); color: var(--accent3); background: rgba(192,38,211,0.07); }
  .btn-row { display: flex; gap: 12px; margin-top: 28px; }
  .btn {
    flex: 1; padding: 14px; border-radius: 12px;
    font-family: 'Syne', sans-serif; font-size: 15px; font-weight: 700;
    cursor: pointer; transition: all 0.2s; border: none;
  }
  .btn-primary {
    background: linear-gradient(135deg, #c026d3, #7e22ce);
    color: white; box-shadow: 0 4px 20px rgba(192,38,211,0.35);
  }
  .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 6px 24px rgba(192,38,211,0.5); }
  .btn-secondary { background: var(--surface); color: var(--muted); border: 1px solid var(--border); }
  .btn-secondary:hover { color: var(--text); border-color: var(--muted); }
  .result-card {
    background: var(--card); border: 1px solid rgba(232,121,249,0.3);
    border-radius: var(--radius); padding: 28px; animation: fadeUp 0.4s ease;
  }
  .result-title { font-family: 'Syne', sans-serif; font-size: 22px; font-weight: 800; color: var(--accent3); margin-bottom: 8px; }
  .result-subtitle { color: var(--muted); font-size: 13px; margin-bottom: 28px; }
  .result-section { margin-bottom: 24px; }
  .result-section h3 {
    font-family: 'Syne', sans-serif; font-size: 13px; font-weight: 700;
    text-transform: uppercase; letter-spacing: 0.08em; color: var(--accent); margin-bottom: 10px;
    display: flex; align-items: center; gap: 8px;
  }
  .result-section h3::after { content: ''; flex: 1; height: 1px; background: var(--border); }
  .result-content {
    background: var(--surface); border-radius: 12px; padding: 16px;
    font-size: 14px; line-height: 1.7; color: var(--text);
    border: 1px solid var(--border); white-space: pre-wrap;
  }
  .loading-state { display: flex; align-items: center; gap: 12px; padding: 20px; color: var(--muted); font-size: 14px; }
  .spinner {
    width: 20px; height: 20px; border: 2px solid var(--border);
    border-top-color: var(--accent); border-radius: 50%; animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .progress-bar { height: 4px; background: var(--border); border-radius: 2px; margin-bottom: 24px; overflow: hidden; }
  .progress-fill {
    height: 100%; background: linear-gradient(90deg, #c026d3, #f472b6);
    border-radius: 2px; transition: width 0.5s ease;
  }
  textarea.error { border-color: #f43f5e !important; background: rgba(244,63,94,0.05); }
  .error-msg {
    background: rgba(244,63,94,0.12); border: 1px solid rgba(244,63,94,0.35);
    color: #fb7185; border-radius: 10px; padding: 10px 14px;
    font-size: 13px; margin-bottom: 16px; display: flex; align-items: center; gap: 8px;
  }
  .error-msg::before { content: "⚠"; font-size: 14px; }
  .tab-btn.missing { border-color: rgba(244,63,94,0.5) !important; color: #fb7185 !important; }
</style>
</head>
<body>
<div class="bg-glow"></div>
<div class="app">
  <div class="header">
    <div class="badge">🚀 Mentoria Expert Foguete</div>
    <h1>Defina seu Nicho,<br>Avatar e Método</h1>
    <p class="subtitle">Responda as perguntas abaixo com o máximo de atenção para que<br>nossa IA te indique qual o seu nicho, avatar e método.</p>
  </div>

  <div class="stepper" id="stepper">
    <div class="step active" id="step-0" onclick="goToPhase(0)">
      <div class="step-circle">1</div>
      <div class="step-label">Nicho</div>
    </div>
    <div class="step-connector" id="conn-0"></div>
    <div class="step" id="step-1" onclick="goToPhase(1)">
      <div class="step-circle">2</div>
      <div class="step-label">Avatar</div>
    </div>
    <div class="step-connector" id="conn-1"></div>
    <div class="step" id="step-2" onclick="goToPhase(2)">
      <div class="step-circle">3</div>
      <div class="step-label">Método</div>
    </div>
    <div class="step-connector" id="conn-2"></div>
    <div class="step" id="step-3">
      <div class="step-circle">✦</div>
      <div class="step-label">Resultado</div>
    </div>
  </div>

  <div class="progress-bar">
    <div class="progress-fill" id="progressFill" style="width: 0%"></div>
  </div>

  <div id="content"></div>
</div>

<script>
  // ⚠️ TROQUE PELA URL DO SEU CLOUDFLARE WORKER (você vai receber após criar)
  const WORKER_URL = "https://SEU-WORKER.SEU-USUARIO.workers.dev";

  let currentPhase = 0;
  let currentClient = 0;
  const answers = { phase0: {}, phase1: { c0: {}, c1: {}, c2: {} }, phase2: {} };

  const phase0Questions = [
    { id: 'tema', label: 'Qual é o tema de ensino do seu projeto?', hint: 'Ex: maternidade, confeitaria, corte a laser…' },
    { id: 'conquistas', label: 'Quais principais conquistas você já obteve que as pessoas não costumam ter?', hint: 'Premiações, títulos, feitos marcantes' },
    { id: 'gosta_falar', label: 'O que você gosta muito de falar sobre?', hint: 'Temas que te animam naturalmente' },
    { id: 'pedem_ensinar', label: 'O que as pessoas pedem ou já pediram para você ensinar?', hint: '' },
    { id: 'domina', label: 'Quais assuntos você domina tanto que poderia responder 1 milhão de perguntas sem travar?', hint: '' },
    { id: 'desafios', label: 'Quais grandes desafios você já superou na sua vida?', hint: 'Pessoais e profissionais' },
    { id: 'beneficia', label: 'Quem pode se beneficiar do que você ensina?', hint: 'Quem é essa pessoa?' },
    { id: 'objetivo_3m', label: 'Qual é seu principal objetivo para os próximos 3 meses?', hint: '', short: true },
    { id: 'objetivo_1a', label: 'Qual é seu principal objetivo em 1 ano?', hint: '', short: true },
  ];

  const clientQuestions = [
    { id: 'perfil', label: 'Qual era o perfil dessa pessoa quando chegou até você?', hint: 'Trabalhava com quê? Em que estágio estava?' },
    { id: 'chegou', label: 'Como ela chegou até você?', hint: 'Ex: indicação, Instagram…', short: true },
    { id: 'disse_precisar', label: 'O que ela disse que precisava? Use as palavras dela.', hint: 'Ex: "não tô vendendo", "quero aprender a precificar"' },
    { id: 'problema_real', label: 'O que você enxergou como o problema real?', hint: 'Diferente do que ela verbalizou' },
    { id: 'crenca', label: 'Qual era a crença errada que ela carregava?', hint: '' },
    { id: 'transformacao', label: 'Quais foram as principais transformações dessa pessoa?', hint: 'Ex: faturou 20k, reduziu custos…' },
    { id: 'tempo', label: 'Em quanto tempo você percebeu uma mudança?', hint: 'Ex: 1 mês, 2–3 meses…', short: true },
    { id: 'cliente_ideal', label: 'Por que essa pessoa foi um cliente ideal para você?', hint: 'Perfil, mentalidade, comportamento…' },
  ];

  const phase2Questions = [
    { id: 'tem_metodo', label: 'Você considera que tem um método claro?', hint: 'Sim ou não, e explique brevemente', short: true },
    { id: 'estagio_inicial', label: 'Qual é o estágio inicial que seu aluno chega para aprender com você?', hint: 'O "antes" do aluno' },
    { id: 'transformacao_final', label: 'Qual é a transformação que a pessoa passa a ter ao final do seu método?', hint: 'O "depois" do aluno' },
    { id: 'pilares', label: 'Quais pilares o aluno precisa dominar? (2 a 5)', hint: 'Ex: produto, conteúdo e venda' },
    { id: 'diferenciais', label: 'Você observa algum diferencial do seu método? Qual?', hint: 'O que te faz único no mercado' },
  ];

  function updateStepper() {
    const progress = [10, 40, 70, 100];
    document.getElementById('progressFill').style.width = progress[currentPhase] + '%';
    for (let i = 0; i < 4; i++) {
      const el = document.getElementById('step-' + i);
      el.className = 'step' + (i < currentPhase ? ' done' : '') + (i === currentPhase ? ' active' : '');
      if (i < 3) {
        document.getElementById('conn-' + i).className = 'step-connector' + (i < currentPhase ? ' done' : '');
      }
    }
  }

  function saveCurrentAnswers() {
    if (currentPhase === 0) {
      phase0Questions.forEach(q => { const el = document.getElementById('q_' + q.id); if (el) answers.phase0[q.id] = el.value; });
    } else if (currentPhase === 1) {
      clientQuestions.forEach(q => { const el = document.getElementById('q_' + q.id); if (el) answers.phase1['c' + currentClient][q.id] = el.value; });
    } else if (currentPhase === 2) {
      phase2Questions.forEach(q => { const el = document.getElementById('q_' + q.id); if (el) answers.phase2[q.id] = el.value; });
    }
  }

  function buildQuestions(questions, savedObj) {
    return questions.map((q, i) => `
      <div class="question-block">
        <div class="question-label"><span class="q-num">${i+1}</span>${q.label}</div>
        ${q.hint ? `<div class="hint">${q.hint}</div>` : ''}
        <textarea id="q_${q.id}" class="${q.short ? 'short' : ''}" placeholder="Sua resposta aqui…" oninput="this.classList.remove('error'); const e=document.querySelector('.error-msg'); if(e) e.remove();">${savedObj[q.id] || ''}</textarea>
      </div>`).join('');
  }

  function renderPhase0() {
    document.getElementById('content').innerHTML = `
      <div class="phase-card">
        <div class="phase-header">
          <div class="phase-icon p1">🔍</div>
          <div><div class="phase-title">Diagnóstico de Nicho</div>
          <div class="phase-desc">Vamos entender sua expertise e onde ela encaixa no mercado</div></div>
        </div>
        ${buildQuestions(phase0Questions, answers.phase0)}
        <div class="btn-row"><button class="btn btn-primary" onclick="nextPhase()">Próximo: Avatar →</button></div>
      </div>`;
  }

  function renderPhase1() {
    const labels = ['Cliente 1', 'Cliente 2', 'Cliente 3'];
    const tabs = labels.map((l, i) => {
      const filled = answers.phase1['c' + i].perfil && i !== currentClient;
      return `<button class="tab-btn ${currentClient === i ? 'active' : ''} ${filled ? 'filled' : ''}" onclick="switchClient(${i})">${filled ? '✓ ' : ''}${l}</button>`;
    }).join('');
    document.getElementById('content').innerHTML = `
      <div class="phase-card">
        <div class="phase-header">
          <div class="phase-icon p2">👤</div>
          <div><div class="phase-title">Público-alvo e Transformação</div>
          <div class="phase-desc">Descreva 3 clientes ideais (reais ou simulados)</div></div>
        </div>
        <div class="client-tabs">${tabs}</div>
        ${buildQuestions(clientQuestions, answers.phase1['c' + currentClient])}
        <div class="btn-row">
          <button class="btn btn-secondary" onclick="prevPhase()">← Voltar</button>
          <button class="btn btn-primary" onclick="nextPhase()">Próximo: Método →</button>
        </div>
      </div>`;
  }

  function renderPhase2() {
    document.getElementById('content').innerHTML = `
      <div class="phase-card">
        <div class="phase-header">
          <div class="phase-icon p3">⚡</div>
          <div><div class="phase-title">Seu Método</div>
          <div class="phase-desc">Como você transforma as pessoas? Qual é o caminho?</div></div>
        </div>
        ${buildQuestions(phase2Questions, answers.phase2)}
        <div class="btn-row">
          <button class="btn btn-secondary" onclick="prevPhase()">← Voltar</button>
          <button class="btn btn-primary" onclick="generateResult()">✦ Gerar meu Resultado</button>
        </div>
      </div>`;
  }

  function switchClient(i) {
    saveCurrentAnswers(); currentClient = i; renderPhase1();
  }

  function goToPhase(i) {
    if (i <= currentPhase) { saveCurrentAnswers(); currentPhase = i; updateStepper(); render(); }
  }

  function validatePhase0() {
    let ok = true;
    phase0Questions.forEach(q => {
      const el = document.getElementById('q_' + q.id);
      if (el && !el.value.trim()) { el.classList.add('error'); ok = false; }
      else if (el) el.classList.remove('error');
    });
    return ok;
  }

  function validatePhase1() {
    let allClientsOk = true;
    const missing = [];
    for (let c = 0; c < 3; c++) {
      let clientOk = true;
      clientQuestions.forEach(q => {
        const val = answers.phase1['c' + c][q.id];
        if (!val || !val.trim()) { clientOk = false; allClientsOk = false; }
      });
      if (!clientOk) missing.push(c);
    }
    clientQuestions.forEach(q => {
      const el = document.getElementById('q_' + q.id);
      if (el && !el.value.trim()) el.classList.add('error');
      else if (el) el.classList.remove('error');
    });
    return { ok: allClientsOk, missing };
  }

  function validatePhase2() {
    let ok = true;
    phase2Questions.forEach(q => {
      const el = document.getElementById('q_' + q.id);
      if (el && !el.value.trim()) { el.classList.add('error'); ok = false; }
      else if (el) el.classList.remove('error');
    });
    return ok;
  }

  function showError(msg) {
    const existing = document.querySelector('.error-msg');
    if (existing) existing.remove();
    const div = document.createElement('div');
    div.className = 'error-msg';
    div.textContent = msg;
    const btnRow = document.querySelector('.btn-row');
    if (btnRow) btnRow.parentNode.insertBefore(div, btnRow);
    div.scrollIntoView({ behavior: 'smooth', block: 'center' });
  }

  function nextPhase() {
    saveCurrentAnswers();
    if (currentPhase === 0) {
      if (!validatePhase0()) { showError('Preencha todas as perguntas antes de continuar.'); return; }
    }
    if (currentPhase === 1) {
      const result = validatePhase1();
      if (!result.ok) {
        const tabs = document.querySelectorAll('.tab-btn');
        result.missing.forEach(i => { if (tabs[i]) tabs[i].classList.add('missing'); });
        const clientesStr = result.missing.map(i => 'Cliente ' + (i+1)).join(', ');
        showError('Preencha todas as perguntas dos 3 clientes antes de continuar. Faltando: ' + clientesStr);
        return;
      }
    }
    currentPhase++; updateStepper(); render();
  }

  function prevPhase() { saveCurrentAnswers(); currentPhase--; updateStepper(); render(); }

  function render() {
    if (currentPhase === 0) renderPhase0();
    else if (currentPhase === 1) renderPhase1();
    else if (currentPhase === 2) renderPhase2();
  }

  async function generateResult() {
    saveCurrentAnswers();
    if (!validatePhase2()) { showError('Preencha todas as perguntas antes de gerar o resultado.'); return; }
    currentPhase = 3; updateStepper();
    document.getElementById('content').innerHTML = `
      <div class="result-card">
        <div class="result-title">Gerando seu resultado…</div>
        <div class="result-subtitle">A IA está analisando tudo que você respondeu</div>
        <div class="loading-state"><div class="spinner"></div> Consolidando nicho, avatar e método…</div>
      </div>`;

    const a0 = answers.phase0, a1 = answers.phase1, a2 = answers.phase2;
    const prompt = `Você é um especialista em posicionamento estratégico para experts e mentores digitais. Com base nas respostas abaixo, gere um diagnóstico completo e acionável com:

1. 🎯 NICHO DEFINIDO — nome do nicho específico, para quem, qual dor principal, qual promessa central
2. 👤 AVATAR DO CLIENTE IDEAL — síntese dos 3 clientes: quem é, o que quer, crença errada, linguagem que usa
3. ⚡ MÉTODO ESTRUTURADO — nome sugerido para o método, pilares, estágio inicial e transformação final
4. ✦ DIFERENCIAL DE POSICIONAMENTO — o que torna esse expert único e como deve se posicionar
5. 🚀 PRÓXIMOS PASSOS — 3 ações concretas para começar a construir presença digital

---
DIAGNÓSTICO:
Tema: ${a0.tema||'?'} | Conquistas: ${a0.conquistas||'?'} | Gosta de falar: ${a0.gosta_falar||'?'}
Pedem ensinar: ${a0.pedem_ensinar||'?'} | Domina: ${a0.domina||'?'} | Desafios: ${a0.desafios||'?'}
Beneficia: ${a0.beneficia||'?'} | Obj 3m: ${a0.objetivo_3m||'?'} | Obj 1a: ${a0.objetivo_1a||'?'}

CLIENTES IDEAIS:
C1: perfil=${a1.c0.perfil||'?'} | problema real=${a1.c0.problema_real||'?'} | crença=${a1.c0.crenca||'?'} | transformação=${a1.c0.transformacao||'?'}
C2: perfil=${a1.c1.perfil||'?'} | problema real=${a1.c1.problema_real||'?'} | crença=${a1.c1.crenca||'?'} | transformação=${a1.c1.transformacao||'?'}
C3: perfil=${a1.c2.perfil||'?'} | problema real=${a1.c2.problema_real||'?'} | crença=${a1.c2.crenca||'?'} | transformação=${a1.c2.transformacao||'?'}

MÉTODO:
Estágio inicial: ${a2.estagio_inicial||'?'} | Transformação: ${a2.transformacao_final||'?'}
Pilares: ${a2.pilares||'?'} | Diferenciais: ${a2.diferenciais||'?'}

Escreva em português brasileiro, de forma clara e estratégica. Use os dados para ser específico.`;

    try {
      const res = await fetch(WORKER_URL, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ prompt })
      });
      const data = await res.json();
      const text = data.text || 'Erro ao gerar resultado.';
      renderResult(text);
    } catch (e) {
      renderResult('Erro de conexão. Verifique a URL do Worker e tente novamente.\n\n' + e.message);
    }
  }

  function renderResult(result) {
    window._lastResult = result;
    const clean = result.replace(/#{1,3} /g, '').trim();
    const parts = clean.split(/\n\n(?=[🎯👤⚡✦🚀1-5])/);
    let sectionsHtml = '';
    if (parts.length <= 1) {
      sectionsHtml = `<div class="result-section"><div class="result-content">${clean}</div></div>`;
    } else {
      parts.forEach(part => {
        const lines = part.trim().split('\n');
        const title = lines[0].replace(/[*#.]/g, '').replace(/^\d+\s*/, '').trim();
        const body = lines.slice(1).join('\n').replace(/\*\*/g, '').trim();
        if (body) sectionsHtml += `<div class="result-section"><h3>${title}</h3><div class="result-content">${body}</div></div>`;
      });
    }
    document.getElementById('content').innerHTML = `
      <div class="result-card">
        <div class="result-title">✦ Seu Posicionamento Estratégico</div>
        <div class="result-subtitle">Resultado gerado com base em todas as suas respostas</div>
        ${sectionsHtml}
        <div class="btn-row">
          <button class="btn btn-secondary" onclick="currentPhase=0; updateStepper(); render()">↺ Refazer</button>
          <button class="btn btn-primary" onclick="navigator.clipboard.writeText(window._lastResult).then(()=>alert('Copiado!'))">Copiar resultado</button>
        </div>
      </div>`;
  }

  updateStepper();
  render();
</script>
